on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use for building
        type: string
        required: false
        default: '3.x'
    outputs:
      artifact-name:
        description: Name of the artifact containing build packages
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # needed for setuptools-scm
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"  # TODO: update to a newer version later

      - name: Install pypa/build
        run: python3 -m pip install build twine --user

      - name: Build package
        run: python3 -m build

      - name: Verify package
        run: twine check --strict dist/*

      - id: artifact-name
        run: echo "artifact-name=python-package-distributions" >> $GITHUB_OUTPUT

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact-name.outputs.artifact-name }}
          path: dist/
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.artifact-name }}
