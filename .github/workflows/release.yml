name: Release

on:
  push:
    tags:
      - 'v*'
      # There should be no dev tags created, but to be safe,
      # let's not publish them.
      - '!v*.dev*'

permissions: {}

jobs:
  build-and-publish:
    uses: $/.github/workflows/build-and-publish.yml
    with:
      environment-url: https://pypi.org/project/django-simple-menu/
      gh-release: true
