name: Release

on:
  push:
    tags:
      - 'v*'
      # There should be no dev tags created, but to be safe,
      # let's not publish them.
      - '!v*.dev*'

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      python-version: "3.12"  # TODO: update to a newer version later

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: PyPI
      url: https://pypi.org/project/django-simple-menu/
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    name: GitHub release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "${GITHUB_REF_NAME}"
          --repo '${{ github.repository }}'
          --verify-tag
          --draft
          --generate-notes

      - name: Upload artifact to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${GITHUB_REF_NAME}" dist/**
          --repo '${{ github.repository }}'
