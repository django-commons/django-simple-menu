on:
  workflow_call:
    inputs:
      repository-url:
        description: The repository URL to use
        required: false
        default: https://upload.pypi.org/legacy/
        type: string
      environment-name:
        description: GitHub environment to use
        required: false
        default: pypi
        type: string
      environment-url:
        description: URL to use in GitHub environment
        required: false
        type: string
      gh-release:
        description: Whether to create a release on GitHub
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    name: Build
    if: github.repository == 'django-commons/django-simple-menu'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for setuptools-scm
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"  # TODO: update to a newer version later

      - name: Install pypa/build
        run: python3 -m pip install build twine --user

      - name: Build package
        run: python3 -m build

      - name: Verify package
        run: twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to ${{ inputs.environment-name }}
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to ${{ inputs.environment-name }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.repository-url }}
          skip-existing: true
