name: Release to TestPyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-publish:
    uses: $/.github/workflows/build-and-publish.yml
    with:
      repository-url: https://test.pypi.org/legacy/
      environment-name: TestPyPI
      environment-url: https://test.pypi.org/project/django-simple-menu/
      gh-release: false
