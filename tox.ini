[tox]
requires =
    tox>=4.2
env_list =
    py3{14, 13, 12}-dj61
    py3{14, 13, 12}-dj60
    py3{14, 13, 12, 11, 10}-dj52
    py3{12, 11, 10, 9, 8}-dj42
    py3{11, 10, 9, 8}-dj41
    py3{10, 9, 8}-dj32

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    covdefaults
    coverage[toml]
    dj32: Django~=3.2.16
    dj41: Django~=4.1.3
    dj42: Django~=4.2.1
    dj52: Django~=5.2.0
    dj60: Django~=6.0.0
    dj61: Django~=6.1.0
    djmain: https://github.com/django/django/tarball/main
pass_env =
    FORCE_COLOR
    NO_COLOR
set_env =
    DJANGO_SETTINGS_MODULE = simple_menu.test_settings
commands =
    coverage run -m django test -v2 {posargs:simple_menu}
    coverage report
    coverage xml

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
django =
    3.2: dj32
    4.1: dj41
    4.2: dj42
    5.2: dj52
    6.0: dj60
    6.1: dj61
    main: djmain
